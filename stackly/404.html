<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | STACKLY</title>
  <meta name="description" content="The page you're looking for doesn't exist or has been moved.">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/404.css">
</head>
<body>

  <span class="shape sqr sh1"></span>
  <span class="shape circle sh2"></span>
  <span class="shape tri sh3"></span>
  <span class="shape sqr sh4"></span>
  <span class="shape circle sh5"></span>
  <span class="shape tri sh6"></span>

  <div class="scan-line"></div>

  <main class="stage">
    <a class="error-logo" href="index.html" aria-label="Stackly home">
      <img src="images/Stackly_logo_gradient.png" alt="Stackly">
    </a>
    <p class="n404" aria-label="404 error" role="img">
      <span class="col">4</span><span class="col">0</span><span class="col">4</span>
    </p>
    <h1 class="n-title">Page <em>Not Found</em></h1>
    <p class="n-text">Oops! The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <div class="n-actions">
      <button type="button" class="nbtn ghost" data-go-back><i class="fa-solid fa-arrow-left-long"></i> Go Back</button>
      <button type="button" class="nbtn" data-back-home>Back to Home <i class="fa-solid fa-arrow-right-long"></i></button>
    </div>
  </main>

  <script src="js/404.js"></script>
</body>
</html>
